version: "3.9"

services:
  nextjs:
    container_name: next_portfolio
    build:
      context: ../../
      dockerfile: docker/development/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../../:/app
      - /app/node_modules
    env_file:
      - ../../.env.local
    environment:
      - NODE_ENV=development
    command: ["npm", "run", "dev"]
